<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testimonial Section</title>
<link rel="stylesheet" href="../utils/animations.css">
<link rel="stylesheet" href="testimonial.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
  <section class="testimonials">
    <div class="testimonials-container">
      <div class="testimonials-header">
        <h2>Отзывы</h2>
        <p>Что говорят наши клиенты</p>
      </div>
      <div class="testimonials-grid">
        <div class="testimonial-card">
          <div class="testimonial-stars">★★★★★</div>
          <p class="testimonial-text">Отличный сервис! Всё быстро и качественно.</p>
          <div class="testimonial-author">
            <div class="testimonial-avatar">ИП</div>
            <div>
              <p class="testimonial-name">Иван Петров</p>
              <p class="testimonial-role">Клиент</p>
            </div>
          </div>
        </div>
        <div class="testimonial-card">
          <div class="testimonial-stars">★★★★★</div>
          <p class="testimonial-text">Рекомендую! Профессиональный подход.</p>
          <div class="testimonial-author">
            <div class="testimonial-avatar">МС</div>
            <div>
              <p class="testimonial-name">Мария Сидорова</p>
              <p class="testimonial-role">Клиент</p>
            </div>
          </div>
        </div>
        <div class="testimonial-card">
          <div class="testimonial-stars">★★★★★</div>
          <p class="testimonial-text">Лучший сервис на рынке.</p>
          <div class="testimonial-author">
            <div class="testimonial-avatar">АК</div>
            <div>
              <p class="testimonial-name">Алексей Козлов</p>
              <p class="testimonial-role">Клиент</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
