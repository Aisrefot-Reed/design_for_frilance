<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Mockup</title>
<link rel="stylesheet" href="../utils/animations.css">
<link rel="stylesheet" href="device-mockup.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0f14; padding: 2rem; }
  .demo { display: flex; gap: 3rem; align-items: center; flex-wrap: wrap; justify-content: center; }
  .screen-fill { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
</style>
</head>
<body>
  <div class="demo">
    <div class="device device-laptop">
      <div class="device-screen screen-fill"></div>
    </div>
    <div class="device device-phone">
      <div class="device-screen screen-fill"></div>
    </div>
  </div>
</body>
</html>
