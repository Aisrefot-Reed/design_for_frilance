<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticky Scroll</title>
<link rel="stylesheet" href="../utils/animations.css">
<link rel="stylesheet" href="sticky-scroll.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f9fafb; padding: 3rem 0; }
</style>
</head>
<body>
  <div class="sticky-scroll">
    <div class="sticky-scroll-aside">
      <h2>Как мы работаем</h2>
      <p>Четыре шага от заявки до результата. Слева — заголовок, который остаётся на месте, справа — шаги.</p>
    </div>
    <div class="sticky-scroll-steps">
      <div class="sticky-step">
        <div class="sticky-step-num">1</div>
        <h3>Заявка</h3>
        <p>Оставляете заявку или звоните.</p>
      </div>
      <div class="sticky-step">
        <div class="sticky-step-num">2</div>
        <h3>Согласование</h3>
        <p>Обсуждаем детали и сроки.</p>
      </div>
      <div class="sticky-step">
        <div class="sticky-step-num">3</div>
        <h3>Работа</h3>
        <p>Выполняем и держим в курсе.</p>
      </div>
      <div class="sticky-step">
        <div class="sticky-step-num">4</div>
        <h3>Результат</h3>
        <p>Сдаём работу и остаёмся на связи.</p>
      </div>
    </div>
  </div>
</body>
</html>
