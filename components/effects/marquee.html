<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marquee</title>
<link rel="stylesheet" href="../utils/animations.css">
<link rel="stylesheet" href="marquee.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; background: #0a0a0f; font-family: system-ui, sans-serif; }
  .item { padding: 0.75rem 1.5rem; background: #1a1a2e; border-radius: 999px; color: #fff; white-space: nowrap; font-weight: 500; }
</style>
</head>
<body>
  <div class="marquee">
    <div class="marquee-track">
      <span class="item">Доставка</span>
      <span class="item">Самовывоз</span>
      <span class="item">Оплата картой</span>
      <span class="item">Открытки</span>
      <span class="item">Подарочная упаковка</span>
    </div>
    <div class="marquee-track" aria-hidden="true">
      <span class="item">Доставка</span>
      <span class="item">Самовывоз</span>
      <span class="item">Оплата картой</span>
      <span class="item">Открытки</span>
      <span class="item">Подарочная упаковка</span>
    </div>
  </div>
</body>
</html>
