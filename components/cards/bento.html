<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bento Grid</title>
<link rel="stylesheet" href="../utils/animations.css">
<link rel="stylesheet" href="bento.css">
<style>
  body { margin: 0; min-height: 100vh; background: #0a0a0f; display: flex; align-items: center; justify-content: center; }
  .container { width: 100%; max-width: 1000px; padding: 1rem; }
  h2 { color: #fff; text-align: center; margin-bottom: 1rem; }
</style>
</head>
<body>
  <div class="container">
    <h2>Bento Grid</h2>
    <div class="bento">
      <div class="bento-item bento-item-dark">
        <h3>Карточка 1</h3>
        <p>Обычная карточка с тёмным фоном</p>
      </div>
      <div class="bento-item">
        <h3>Карточка 2</h3>
        <p>Обычная карточка</p>
      </div>
      <div class="bento-item bento-item-accent">
        <h3>Карточка 3</h3>
        <p>Акцентная карточка</p>
      </div>
      <div class="bento-item">
        <h3>Карточка 4</h3>
        <p>Обычная карточка</p>
      </div>
      <div class="bento-item bento-item-gradient bento-item-wide">
        <h3>Широкая карточка</h3>
        <p>Карточка на 2 колонки с градиентом</p>
      </div>
    </div>
  </div>
</body>
</html>
